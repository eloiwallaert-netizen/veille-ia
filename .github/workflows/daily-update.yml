name: Mise à jour quotidienne des actus

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les actus IA (RSS)
        run: python3 scripts/fetch_news.py

      - name: Commit et push si le contenu a changé
        run: |
          git config user.name "veille-ia-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/articles.json; then
            echo "Aucun changement, rien à committer."
          else
            git add data/articles.json
            git commit -m "Mise à jour automatique des actus IA"
            git push
          fi
